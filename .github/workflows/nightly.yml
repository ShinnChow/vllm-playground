name: Nightly CPU E2E

# Real end-to-end proof that "the whole stack works": starts the actual app,
# launches a real tiny model as a real CPU vLLM subprocess (no mocks), and
# chats with it through /v1/chat/completions and /v1/completions.
#
# Too slow (minutes, model download) and occasionally flaky (network,
# upstream model hub) to gate every PR on -- runs nightly instead, plus
# on-demand via workflow_dispatch (e.g. against `main` right before cutting
# a release, as an extra pre-release sanity check).
on:
  schedule:
    - cron: "0 3 * * *" # 3am UTC daily, against the default branch (development)
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch/tag/SHA to run the CPU E2E test against"
        required: false
        default: "development"

permissions:
  contents: read
  issues: write # to open/update the failure-tracking issue on regressions

env:
  PYTHONUNBUFFERED: "1"
  HF_HUB_DISABLE_TELEMETRY: "1"

jobs:
  container-build-check:
    name: Container build check (${{ matrix.image.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Moved here from ci.yml: builds are slow (the Podman image takes
    # ~7-8 minutes, mostly `microdnf install podman-remote`) and
    # container/OpenShift orchestration isn't the primary,
    # actively-developed use case (that's local/CLI usage). Running
    # nightly instead of on every PR still catches breakage, just within
    # a day instead of blocking every push.
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: vllm-playground (Podman orchestrator)
            containerfile: containers/Containerfile.vllm-playground
          - name: openshift (Kubernetes orchestrator)
            containerfile: openshift/Containerfile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || 'development' }}

      - uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image.containerfile }}
          push: false
          load: true
          tags: vllm-playground-ci:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Boot image and smoke test /api/status
        run: |
          docker run -d --name ci-smoke -p 7860:7860 vllm-playground-ci:test
          ok=0
          for i in $(seq 1 30); do
            if curl -sf http://localhost:7860/api/status > /dev/null; then ok=1; break; fi
            sleep 2
          done
          docker logs ci-smoke || true
          docker rm -f ci-smoke || true
          if [ "$ok" -ne 1 ]; then
            echo "::error::Container never became healthy on /api/status"
            exit 1
          fi

      - name: Open/update failure-tracking issue
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Nightly container build check is failing";
            const body = [
              `The scheduled [Nightly container build check](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) workflow failed for image: ${{ matrix.image.name }}.`,
              "",
              "This builds the Podman and OpenShift container images from their Containerfiles and boots each one to confirm GET /api/status responds -- a failure here means a deployed container image is (or would be) broken.",
            ].join("\n");

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: ["nightly-container-build-failure"],
            });

            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["nightly-container-build-failure"],
              });
            }

  cpu-chat-e2e:
    name: Real CPU model chat E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || 'development' }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install vllm (CPU build) + playground + test deps
        run: |
          pip install --upgrade pip
          pip install vllm
          pip install -e ".[dev]"

      - name: Run real CPU model chat E2E test
        run: pytest tests/e2e_nightly -v -s

      - name: Open/update failure-tracking issue
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Nightly CPU E2E is failing";
            const body = [
              `The scheduled [Nightly CPU E2E](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) workflow failed.`,
              "",
              "This test starts a real tiny CPU model through the app and chats with it end-to-end -- a failure here means the core 'start a model, chat with it' happy path is broken, even though nothing blocked a PR.",
            ].join("\n");

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: ["nightly-e2e-failure"],
            });

            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["nightly-e2e-failure"],
              });
            }
